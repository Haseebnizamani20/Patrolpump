<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#E11D48" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FDE047" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="#090D16" rx="16"/>

  <!-- Logo Mark Container -->
  <g transform="translate(400, 175)">
    <!-- Outer Hexagonal Shield -->
    <path d="M 0 -110 L 95 -55 L 95 55 L 0 110 L -95 55 L -95 -55 Z" 
          fill="url(#shieldGrad)" stroke="#334155" stroke-width="4"/>
    
    <!-- Fuel Drop & Road Graphic -->
    <path d="M 0 -75 C 35 -25, 55 15, 55 45 C 55 75, 30 85, 0 85 C -30 85, -55 75, -55 45 C -55 15, -35 -25, 0 -75 Z" 
          fill="url(#flameGrad)" />

    <!-- Negative Space Highway Curve -->
    <path d="M -12 85 L -4 10 L 4 10 L 12 85 Z" fill="#0F172A"/>
    <line x1="0" y1="20" x2="0" y2="40" stroke="#FDE047" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="55" x2="0" y2="75" stroke="#FDE047" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Typography -->
  <g text-anchor="middle">
    <!-- Main Station Name -->
    <text x="400" y="340" 
          font-family="'Montserrat', 'Arial Black', sans-serif" 
          font-size="38" 
          font-weight="900" 
          letter-spacing="4" 
          fill="#FFFFFF">
      NIAZ GOHRAM
    </text>

    <!-- Subtitle / Industry -->
    <text x="400" y="380" 
          font-family="'Segoe UI', Roboto, sans-serif" 
          font-size="18" 
          font-weight="700" 
          letter-spacing="10" 
          fill="#F59E0B">
      PETROL PUMP
    </text>

    <!-- Tagline Divider Lines -->
    <line x1="220" y1="415" x2="330" y2="415" stroke="#334155" stroke-width="1.5"/>
    <circle cx="400" cy="415" r="4" fill="#E11D48"/>
    <line x1="470" y1="415" x2="580" y2="415" stroke="#334155" stroke-width="1.5"/>

    <text x="400" y="445" 
          font-family="'Segoe UI', Roboto, sans-serif" 
          font-size="13" 
          font-weight="500" 
          letter-spacing="3" 
          fill="#94A3B8">
      QUALITY FUEL &bull; FAST SERVICE
    </text>
  </g>
</svg>
